      if (acts.childNodes.length) root.appendChild(acts);
      else { var miss = el('div', 'ot-missing'); miss.appendChild(el('span', 'dot-red')); miss.appendChild(document.createTextNode('No phone or email on file')); root.appendChild(miss); }
      // To sort out (server-built, plain English) + billing text for Michal
      var todo = (p.todo || []).filter(function (x) { return !/^No phone or email/.test(x.t) || acts.childNodes.length; });
      if (todo.length) {
        root.appendChild(makeSec('To sort out', ''));
        var tc = otTodoCard(todo);
        if (p.copy) {
          var f = el('div', 'ot-todo-foot'), fb = el('div', 'ot-btns');
          fb.appendChild(otBtn('Copy for Michal', 'checksq', null, function () { otCopy(p.copy); }));
          f.appendChild(fb); tc.appendChild(f);
        }
        root.appendChild(tc);
      }
      // Ready-to-send text in Roni's voice: opens his own Messages / mail app, nothing is sent from here.
      if (p.draft) {
        root.appendChild(makeSec('Ready to send', ''));
        var dc = el('div', 'card ot-draft'); dc.id = 'otDraft';
        dc.appendChild(el('p', 'ot-draft__text', p.draft));
        var bx = el('div', 'ot-btns');
        if (p.phone) bx.appendChild(otBtn('Text', 'msg', otSms(p.phone, p.draft)));
        if (p.email) bx.appendChild(otBtn('Email', 'mail', 'mailto:' + p.email + '?subject=' + encodeURIComponent('Quick check from Roni') + '&body=' + encodeURIComponent(p.draft)));
        bx.appendChild(otBtn('Copy', 'checksq', null, function () { otCopy(p.draft); }));
        dc.appendChild(bx);
        root.appendChild(dc);
      }
      root.appendChild(makeSec('Students', ''));
      var c = el('div', 'card'), seen = {};
      (p.cases || []).forEach(function (cs) {
        var k = cs.student.toLowerCase(), lines = otSchedLines(cs);
        var row = seen[k];
        if (!row) {
          row = el('button', 'ot-stu'); row.type = 'button';
          var body = el('span'); body.appendChild(el('b', '', cs.student)); row.appendChild(body);
          row.insertAdjacentHTML('beforeend', svg('chev'));
          row.addEventListener('click', function () { otGo({ view: 'student', student: cs.student, prev: state.ot }); });
          seen[k] = row; row._body = body; c.appendChild(row);
        }
        if (!lines.length) lines = [cs.sup ? 'Supervising \u00b7 no set times' : 'No set times'];
        lines.forEach(function (l) { row._body.appendChild(el('div', '', l)); });
      });
      if (!(p.cases || []).length) c.appendChild(el('div', 'me-empty', 'No students listed.'));
      root.appendChild(c);
      var today = ymdLocal(new Date()), done = !!p.checkinToday || p.last === today;
      var b = el('button', 'btn btn--block ot-log'); b.type = 'button'; b.id = 'otLog';
      b.innerHTML = svg('check'); b.appendChild(document.createTextNode(done ? 'Checked in today' : 'Log check-in'));
      if (done) b.disabled = true;
      b.addEventListener('click', function () { otCheckin(p); });
      root.appendChild(b);
      var nt = state.otNote;
      if (nt && nt.pid === p.id) {
        var nw = el('div', 'ot-note'), inp = el('input'); inp.type = 'text'; inp.id = 'otNoteIn'; inp.maxLength = 300;
        inp.placeholder = 'Quick note (optional)'; inp.setAttribute('aria-label', 'Quick note about this check-in');
        var sv = el('button', '', 'Save'); sv.type = 'button'; sv.id = 'otNoteSave';
        sv.addEventListener('click', function () { otSaveNote(p, inp.value); });
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); otSaveNote(p, inp.value); } });
        nw.appendChild(inp); nw.appendChild(sv); root.appendChild(nw);
      }
      var lastTxt = p.last ? 'Last check-in: ' + (p.last === today ? 'today' : otDayLabel(p.last)) : 'No check-ins yet';
      if (p.next && p.last) lastTxt += ' \u00b7 next ' + (p.next <= today && p.last !== today ? 'now' : otDayLabel(p.next));
      root.appendChild(el('p', 'ot-last', lastTxt));
      if (p.note) root.appendChild(el('p', 'ot-lastnote', '\u201c' + p.note + '\u201d'));
    }
    function renderOtStudent(root, D, student) {
      root.appendChild(otBackBtn());
      root.appendChild(el('h2', 'ot-name', student));
      var k = String(student).toLowerCase(), iss = (D.students && D.students[k]) || [];
      if (iss.length) { root.appendChild(makeSec('To sort out', '')); root.appendChild(otTodoCard(iss)); }
      root.appendChild(makeSec('Providers', ''));
      var c = el('div', 'card'), n = 0;
      (D.providers || []).forEach(function (p) {
        var cs = (p.cases || []).filter(function (x) { return x.student.toLowerCase() === k; });
        if (!cs.length) return;
        n++;
        var row = el('div', 'ot-pv'), b = el('button', 'ot-row'); b.type = 'button';
        var body = el('span', 'ot-row__body');
        body.appendChild(el('span', 'ot-row__name', p.name + (cs.some(function (x) { return x.sup; }) ? ' \u00b7 BCBA' : '')));
        var lines = [];
        cs.forEach(function (x) { lines = lines.concat(otSchedLines(x)); });
        body.appendChild(el('span', 'ot-row__sub', lines.length ? lines.join('; ') : 'No set times'));
        b.appendChild(body);
        b.addEventListener('click', function () { otGo({ view: 'person', pid: p.id, prev: state.ot }); });
        row.appendChild(b);
        if (p.phone) { row.appendChild(otIcon('tel:' + p.phone, 'phone', 'Call ' + p.name)); row.appendChild(otIcon('sms:' + p.phone, 'msg', 'Text ' + p.name)); }
        c.appendChild(row);
      });
      if (!n) c.appendChild(el('div', 'me-empty', 'Nobody on this case.'));
      root.appendChild(c);
    }
    function otSaveNote(p, text) {
      var nt = state.otNote; text = String(text || '').trim();
      if (!nt || !text) { state.otNote = null; renderProviders(); return; }
      var btn = $('otNoteSave'); if (btn) btn.disabled = true;
      var send = function (id) {
        run('provCheckinNote', [{ id: id, note: text }],
          function () { p.note = text; state.otNote = null; saveProvCache(); renderProviders(); toast('Note saved'); loadProviders(true); },
          function () { if (btn) btn.disabled = false; toast('Couldn\u2019t save \u2014 try again'); });
      };
      if (nt.id) send(nt.id); else nt.after = send;
    }
    function otDismiss(it) {
      var D = state.prov; if (!D) return;
      D.needs = (D.needs || []).filter(function (x) { return x.key !== it.key; });
      saveProvCache(); renderProviders();
      var my = showUndo('Done \u2014 hidden');
      my.restore = function () {
        run('provUndismiss', [{ key: it.key }], function () { loadProviders(true); toast('Back on the list'); },
          function () { toast('Couldn\u2019t undo'); loadProviders(true); });
      };
      run('provDismiss', [{ key: it.key, sig: it.sig, text: it.text }],
        function () { my.pending = false; if (my.wantUndo) my.restore(); else loadProviders(true); },
        function () { my.pending = false; hideUndo(); toast('Couldn\u2019t save \u2014 try again'); loadProviders(true); });
    }
    function otCheckin(p) {
      var today = ymdLocal(new Date()), prevLast = p.last, btn = $('otLog');
      if (btn) btn.disabled = true;
      p.last = today; p.checkinToday = 'pending'; state.otNote = { pid: p.id, id: null }; saveProvCache(); renderProviders();
      var my = showUndo('Check-in logged for ' + p.short);
      my.restore = function () {
        if (!my.id) { toast('Couldn\u2019t undo'); return; }
        run('provUncheckin', [{ id: my.id }], function () { p.last = prevLast; delete p.checkinToday; state.otNote = null; renderProviders(); loadProviders(true); toast('Check-in removed'); },
          function () { toast('Couldn\u2019t undo'); });
      };
      run('provCheckin', [{ id: p.id }],
        function (res) {
          my.pending = false; my.id = res && res.id; p.checkinToday = my.id || 'yes';
          if (state.otNote && state.otNote.pid === p.id) { state.otNote.id = my.id; if (state.otNote.after && my.id) state.otNote.after(my.id); }
          if (my.wantUndo) my.restore(); else loadProviders(true);
        },
        function () { my.pending = false; hideUndo(); p.last = prevLast; delete p.checkinToday; state.otNote = null; renderProviders(); toast('Couldn\u2019t save \u2014 try again'); });
    }

    /* ---------- Load + boot hardening ---------- */
    var BOOT_LOADING = $('boot').innerHTML;
    var loadSeq = 0;
    function setAppVisible(on) {
      $('topBar').hidden = !on;
      $('app').hidden = !on;
      $('mainNav').hidden = !on;
    }
    /* ---- Stale-while-revalidate: last good data is kept on the phone (per personal link). ---- */
    var DATA_CACHE_KEY = 'homeops.data.v1.' + (window.__homeopsKeyId || 'app');
    function saveCache() {
      try { if (state.data) localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ at: Date.now(), data: state.data })); } catch (e) {}
    }
    function readCache() {
      try {
        var c = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || 'null');
        return (c && c.data && !c.data.error) ? c : null;
      } catch (e) { return null; }
    }
    function showUpdating(on) { var d = $('updDot'); if (d) d.hidden = !on; }
    function applyData(data) {
      if (!data) throw new Error('Server returned no data');
      if (data.error) throw new Error('Server: ' + data.error);
      data.shopping = data.shopping || [];
      data.meals = data.meals || [];
      data.todos = tdMerge(data.todos || []);
      data.openCount = data.shopping.filter(function (x) { return !x.checked; }).length;
      state.data = data;
      if (!state._seededDay && data.today) { state.dinnerDay = data.today; state._seededDay = true; }
      if (!state._storeChosen) {   // open on a store that actually has items until the user picks one
        try {
          var sc = storeCounts(), cur = normalizeStore(state.selectedStore || 'Lidl');
          if (!(sc.counts[cur] > 0)) {
            var best = null;
            sc.order.forEach(function (st) { if ((sc.counts[st] || 0) > (best ? sc.counts[best] : 0)) best = st; });
            if (best) state.selectedStore = best;
          }
        } catch (e) {}
      }
      $('boot').hidden = true;
      setAppVisible(true);
      renderAll();
      if (portalOn() && !state._navTouched && state.screen !== 'me') showScreen('me');
      window.__booted = true;
    }
    function loadData(toastOk) {
      var seq = ++loadSeq;
      var booting = !window.__booted;
      if (booting) {
        var cached = readCache();
        if (cached) {
          try { applyData(cached.data); booting = false; window.__fromCache = true; }
          catch (e) { window.__booted = false; }
        }
      }
      var slowTimer = null;
      if (booting) {
        slowTimer = setTimeout(function () {
          if (seq !== loadSeq || window.__booted) return;
          window.__bootShow('Still loading\u2026 Tap Retry', '', true);
        }, 15000);
      } else {
        showUpdating(true);
      }
      function fail(msg) {
        clearTimeout(slowTimer);
        if (seq === loadSeq) showUpdating(false);
        if (seq !== loadSeq || (booting && window.__booted)) return;
        if (window.__booted) {
          if (toastOk || window.__fromCache) toast('Couldn\u2019t refresh \u2014 showing saved list');
          window.__fromCache = false;
          return;
        }
        window.__bootShow('Couldn\u2019t load', msg, true);
      }
      try {
        run('getData', toastOk ? [{ fresh: true }] : [],
          function (data) {
            clearTimeout(slowTimer);
            if (seq !== loadSeq && window.__booted) return;
            showUpdating(false);
            window.__fromCache = false;
            try {
              applyData(data);
              saveCache();
              if (toastOk) toast('Updated');
            } catch (e) {
              if (window.__booted) { toast('Display error: ' + ((e && e.message) || e)); return; }
              setAppVisible(false);
              fail((e && e.message) || String(e));
            }
          },
          function (err) { fail((err && err.message) || String(err || 'Network or sign-in error')); });
      } catch (e) {
        fail('google.script.run unavailable: ' + ((e && e.message) || e));
      }
    }
    window.__bootRetry = function () {
      var b = $('boot');
      b.innerHTML = BOOT_LOADING;
      b.className = 'boot--skel';
      b.hidden = false;
      b.style.display = '';
      loadData(false);
    };

    /* ---------- Actions ---------- */
    function addItem() {
      var input = $('newItem');
      var name = (input.value || '').trim();
      if (!name) { input.focus(); return; }
      var store = normalizeStore(state.selectedStore || 'Lidl');
      var btn = $('addBtn');
      btn.disabled = true;
      run('addItem', [{ item: name, store: store, qty: 1, unit: 'ea' }],
        function () { input.value = ''; btn.disabled = false; toast('Added to ' + store); loadData(false); },
        function () { btn.disabled = false; toast('Couldn\u2019t add \u2014 try again'); });
    }
    function autoUploadList() {
      closeAllMore();
      var store = normalizeStore(state.selectedStore || 'Lidl');
      var items = storeItems(store).filter(function (s) { return !s.checked; });
      var lines = [store + ' \u2014 shopping list', ''];
      if (!items.length) lines.push('(nothing open)');
      else items.forEach(function (s) {
        var q = fmtQty(s);
        lines.push('\u2022 ' + s.item + (q ? ' (' + q + ')' : ''));
      });
      lines.push('');
      lines.push('\u2014 Gafni House');
      var text = lines.join('\n');
      function ok() { toast('Copied'); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) { toast('Copy failed \u2014 select manually'); }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(fallback);
      else fallback();
    }
    function bulkAddItems() {
      var ta = $('bulkPaste');
      var text = (ta && ta.value) || '';
      if (!String(text).trim()) { ta.focus(); toast('Paste a list first'); return; }
      var store = normalizeStore(state.selectedStore || 'Lidl');
      var btn = $('bulkAddBtn');
      btn.disabled = true;
      run('addItemsBulk', [{ store: store, text: text }],
        function (res) {
          btn.disabled = false;
          ta.value = '';
          toast(((res && res.count) || 0) + ' added to ' + store);
          closeAllMore();
          loadData(false);
        },
        function () { btn.disabled = false; toast('Couldn\u2019t add the list \u2014 try again'); });
    }
    function saveDinner() {
      var btn = $('saveDinnerBtn');
      var payload = {
        day: state.dinnerDay,
        main: ($('dinnerMain').value || '').trim(),
        side: ($('dinnerSide').value || '').trim(),
        salad: ($('dinnerSalad').value || '').trim(),
        soup: ($('dinnerSoup').value || '').trim()
      };
      if (!payload.main && !payload.side && !payload.salad && !payload.soup) {
        $('dinnerMain').focus(); toast('Add at least one course'); return;
      }
      btn.disabled = true;
      run('addMeal', [payload],
        function () { btn.disabled = false; toast('Saved'); loadData(false); },
        function () { btn.disabled = false; toast('Couldn\u2019t save dinner'); });
    }
    function addSpend() {
      if (!isParent(state.viewer)) { toast('Budget isn\u2019t available'); return; }
      var input = $('newSpend');
      var amount = Number(input.value);
      if (!(amount > 0)) { input.focus(); return; }
      var btn = $('addSpendBtn');
      btn.disabled = true;
      var kind = state.spendKind;
      run('addSpend', [{ kind: kind, amount: amount }],
        function () {
          input.value = '';
          btn.disabled = false;
          loadData(false);
          var my = showUndo('Logged ' + money(amount) + ' ' + (kind === 'food' ? 'Food' : 'Amazon'));
          my.pending = false;
          my.restore = function () {
            run('addSpend', [{ kind: kind, amount: amount, undo: true }],
              function () { toast('Undone'); loadData(false); },
              function () { toast('Couldn\u2019t undo'); });
          };
        },
        function () { btn.disabled = false; toast('Couldn\u2019t log spend'); });
    }

    /* ---------- Wiring ---------- */
    $('mainNav').addEventListener('click', function (e) {
      var b = e.target.closest('.nav__item[data-screen]');
      if (!b) return;
      e.preventDefault();
      state._navTouched = true;
      showScreen(b.getAttribute('data-screen'));
    });
    $('refreshBtn').addEventListener('click', function () { loadData(true); if (portalOn()) { loadPortal(true); loadInbox(); if (state._provAsked) loadProviders(true); } });
    $('addBtn').addEventListener('click', addItem);
    $('newItem').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
    $('autoUploadBtn').addEventListener('click', autoUploadList);
    $('clearStoreBtn').addEventListener('click', function () { clearStoreItems(false); });
    $('bulkAddBtn').addEventListener('click', bulkAddItems);
    $('clearWeekBtn').addEventListener('click', clearDinnerWeek);
    $('saveDinnerBtn').addEventListener('click', saveDinner);
    $('todoAddForm').addEventListener('submit', function (e) { e.preventDefault(); addTodo(); });
    $('newTodo').addEventListener('input', todoHint);
    $('spendKindSeg').addEventListener('click', function (e) {
      var b = e.target.closest('.seg__btn[data-kind]');
      if (!b) return;
      state.spendKind = b.getAttribute('data-kind');
      $('spendKindSeg').querySelectorAll('.seg__btn').forEach(function (x) {
        var on = x === b;
        x.classList.toggle('is-active', on);
        x.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
    $('addSpendBtn').addEventListener('click', addSpend);
    $('newSpend').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addSpend(); } });

    updateHeader();
    showScreen('grocery');
    loadData(false);
  })();

  </script>
</body>
</html>
